# dsh-logout-button bundle patch: inserts the dual-face plugin row into the web
# profile roster. The Node half (exports ".") owns the POST /__logout route that
# clears the browser-session cookies; the `dsh.client` declaration in
# package.json loads the browser half (exports "./client") into the Web GUI,
# which renders the button itself.
- insert:
    - id: logout-button
      name: 'dsh-logout-button'
